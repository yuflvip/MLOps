templates:
  - name: "pt-to-onnx-default"
    display_name: "PT to ONNX Default"
    source_format: "pt"
    target_format: "onnx"
    defaults:
      opset: 17
      dynamic: false
    runtime:
      adapter: "onnx_export"
      launcher: "python"
      script_path: "export.py"
      working_dir: "."
