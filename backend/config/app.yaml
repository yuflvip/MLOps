app:
  name: "mlops-backend"
  debug: false
  host: "0.0.0.0"
  port: 18087
  root_path: ""
  api_prefix: "/mlops"
  docs_url: "/docs"
  openapi_url: "/openapi.json"

logging:
  level: "INFO"
  format: "%(asctime)s %(levelname)s [%(name)s] %(message)s"

database:
  url: "sqlite+pysqlite:///./data/mlops.db"

templates:
  training: "./config/training-templates.yaml"
  conversion: "./config/conversion-templates.yaml"

clearml:
  mode: "http"
  api_base_url: "http://192.168.1.155:8008"
  access_key: "L7Z39J8UFULIYZMS5JYEIAS16JMLO6"
  secret_key: "svDrmtzhjcPY_zKdG9fE01CzUqELdtedMEUsE6XpMMdvbiS80FxO4cglbgTMlTJFIgg"
  timeout_seconds: 30
  runner_working_dir: "/home/yufl/workspace-2026/MLOps/backend/scripts"
  runner_entrypoint: "entrypoint.py"

scheduler:
  enabled: false
  timezone: "UTC"
  task_status_sync_interval_seconds: 30

model_conversion:
  max_concurrency: 3
  log_dir: "./data/conversion-logs"
  converters:
    hgnet_to_onnx:
      enabled: true
      python_path: "/root/miniconda3/envs/convnext-env/bin/python"
      working_dir: "/mnt/yolo_tool/build/convnext_cls"
      script_path: "/mnt/yolo_tool/build/convnext_cls/tools/export.py"
    yolo_to_onnx:
      enabled: true
      python_path: "/root/miniconda3/envs/yolov8-env/bin/yolo"
      working_dir: "."
    onnx_to_hisi3403:
      enabled: true
      python_path: "/usr/bin/bash"
      working_dir: "./scripts/model_conversion/hisi3403/svp_nnn"
      script_path: "./scripts/model_conversion/hisi3403/svp_nnn/export_svpnnn_om.sh"
    onnx_to_hisi3403_ascend_nnn:
      enabled: true
      python_path: "/usr/bin/bash"
      working_dir: "./scripts/model_conversion/hisi3403/ascend_nnn"
      script_path: "./scripts/model_conversion/hisi3403/ascend_nnn/export_nnn_om.sh"

quantization_dataset:
  storage_root: "./data/quantization-datasets"
  max_image_size_mb: 100

model_packaging:
  deploy_dir: "/opt/AII/YoloModel"
